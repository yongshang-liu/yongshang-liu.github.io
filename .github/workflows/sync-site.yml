name: Sync site to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # 22:15 UTC = 07:15 Korea Standard Time (next day).
    - cron: "15 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the latest published site
        env:
          SOURCE_SITE: https://personal-studio-2026.sturdypond1.chatgpt.site
          TARGET_SITE: https://yongshang-liu.github.io
        run: |
          set -euo pipefail
          mkdir -p public/resources

          for file in index.html knowledge.html mathematics.html economics-finance.html coding-data.html financial-lab.html courses.html projects.html portal.css robots.txt sitemap.xml resources/Week_9_Black_Scholes_Derivation.pdf; do
            source_path="/$file"
            if [ "$file" = "index.html" ]; then
              source_path="/"
            fi

            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 5 \
              "$SOURCE_SITE$source_path" \
              --output "public/$file"

            test -s "public/$file"
          done

          sed -i "s#${SOURCE_SITE}#${TARGET_SITE}#g" \
            public/index.html public/robots.txt public/sitemap.xml

          # Keep the locally maintained SQL course discoverable even when the
          # upstream visual site is refreshed by the scheduled sync.
          python3 - <<'PY'
          from pathlib import Path

          import runpy
          runpy.run_path("scripts/compact_sql_link.py")["compact"](Path("public/coding-data.html"))

          sitemap = Path("public/sitemap.xml")
          xml = sitemap.read_text(encoding="utf-8")
          if "/sql-learning.html" not in xml:
              entry = '  <url><loc>https://yongshang-liu.github.io/sql-learning.html</loc><lastmod>2026-10-15</lastmod><changefreq>weekly</changefreq><priority>0.9</priority></url>\n'
              sitemap.write_text(xml.replace("</urlset>", entry + "</urlset>"), encoding="utf-8")
          PY

      - name: Preserve USQuant project entry
        run: python3 scripts/feature_usquant.py

      - name: Keep repository files in sync
        run: |
          set -euo pipefail
          cp public/index.html public/knowledge.html public/mathematics.html .
          cp public/economics-finance.html public/coding-data.html .
          cp public/financial-lab.html public/courses.html public/projects.html .
          cp public/portal.css public/robots.txt public/sitemap.xml .
          cp -R public/resources .
          git rm -f --ignore-unmatch us.html global.html china.html news.css

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html knowledge.html mathematics.html economics-finance.html coding-data.html financial-lab.html courses.html projects.html portal.css robots.txt sitemap.xml resources

          if ! git diff --cached --quiet; then
            git commit -m "Sync latest site content"
            git push
          fi

      - name: Include locally maintained SQL teaching resources
        run: |
          set -euo pipefail
          test -s sql-learning.html
          test -s sql/course.js
          test -s sql/financial-data.sql
          grep -q "22 课完整课程" sql-learning.html
          grep -q "每课 3+ 组代码" sql-learning.html
          grep -q "高级 SQL" sql/course.js
          mkdir -p public/sql
          cp sql-learning.html public/sql-learning.html
          cp -R sql/. public/sql/

      # 将本仓库维护的中文学习入口加入发布产物，不受上游页面同步覆盖。
      - name: Include USQuant learning center
        run: |
          test -s usquant-learning.html
          cp usquant-learning.html public/usquant-learning.html

      - name: Publish weekly theory paper archive and preserve its navigation link
        run: |
          set -euo pipefail
          test -s weekly-theory-papers.html
          cp weekly-theory-papers.html public/weekly-theory-papers.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path("public/economics-finance.html")
          html = p.read_text(encoding="utf-8")
          if 'href="weekly-theory-papers.html"' not in html:
              link = '<p><a href="weekly-theory-papers.html">Weekly Theory Papers — dated theoretical financial econometrics and asset pricing reading archive</a></p>'
              if '</main>' in html:
                  html = html.replace('</main>', link + '\n</main>', 1)
              elif '</body>' in html:
                  html = html.replace('</body>', link + '\n</body>', 1)
              else:
                  raise SystemExit("No safe insertion point for paper archive link")
              p.write_text(html, encoding="utf-8")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
